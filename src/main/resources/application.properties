# ---- Base de datos ----
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.xdzcknbayixqcpzydpfn
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- HikariCP (limitar conexiones para no agotar el pool_size de Supabase; sin cache de prepared statements, requerido por el Transaction Pooler) ----
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate

# ---- Migraciones de esquema (schema.sql) ----
# Ejecuta schema.sql en cada arranque, ANTES de que Hibernate valide, para que
# las migraciones pendientes (p. ej. sql/moderacion_resenas.sql) no impidan
# levantar la app. Las sentencias son idempotentes (IF NOT EXISTS).
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ---- JWT ----
jwt.secret=${JWT_SECRET} 
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ---- Cloudflare Workers AI (generador de disenos con IA) ----
cloudflare.account.id=${CLOUDFLARE_ACCOUNT_ID}
cloudflare.api.token=${CLOUDFLARE_API_TOKEN}

supabase.url=https://xdzcknbayixqcpzydpfn.supabase.co
supabase.storage.bucket=disenos
supabase.service.key=${SUPABASE_SERVICE_KEY}

# ---- Subida de archivos (multipart) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Wompi (pasarela de pagos - sandbox) ----
wompi.base-url=https://sandbox.wompi.co/v1
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.events-key=${WOMPI_EVENTS_KEY:}
wompi.checkout-url=https://checkout.wompi.co/l
wompi.redirect-url=${WOMPI_REDIRECT_URL:http://localhost:5173/checkout/resultado}

# ---- Correo (SMTP Gmail) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
